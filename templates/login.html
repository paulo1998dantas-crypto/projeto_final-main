<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Login</title>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-6">
    <div class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-md">
        <h1 class="text-xl font-black text-slate-800 mb-2">Bem-vindo</h1>
        <p class="text-sm text-slate-500 mb-6">Digite seu primeiro nome para continuar.</p>
        <form method="post" action="/login" class="space-y-4">
            <input type="text" name="nome" placeholder="Seu primeiro nome"
                   class="w-full border border-slate-300 p-3 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition" required>
            <button type="submit" class="w-full py-3 bg-blue-600 text-white rounded-2xl font-bold">ENTRAR</button>
        </form>
    </div>
</body>
</html>
